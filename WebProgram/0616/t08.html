<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(document).ready(function(){
            $("body").css("background", "black");

            $("#box").css({
                width : "100px",
                height : "100px",
                backgroundColor : "orange",
                position : "absolute",
                left : "10px",
                top : "10px"
            }).animate({
                width : "500px",
                opacity : 0.2
            }, 4000).animate({
                opacity : 1,
                left : "100px",
                top : "200px"
            }, 4000);
        })
    </script>
</head>
<body>
    <div id="box"></div>
</body>
</html>
