<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(document).ready(function(){
            $("h1").hover(function(){
                    $(this).css({
                        background : "red",
                        color : "white"
                    });
            },
            function(){
                $(this).css({
                    background : "transparent",
                    color : "black"
                });
            });
        })
    </script>
</head>
<body>
    <h1>Click Me</h1>
</body>
</html>
